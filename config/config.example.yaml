database: ~/.local/share/calibre-research/research.sqlite3
rubric: ./config/rubric-1.0.yaml

research:
  provider: stub
  max_cost_per_run_usd: 5.00
  max_cost_per_book_usd: 0.10
  web_search_enabled: true
  reuse_cached_evidence: true

metadata:
  # Providers are tried in order. Later providers are fallbacks for unresolved records.
  providers:
    - openlibrary
    - googlebooks
  reuse_cached_lookups: true

  openlibrary:
    base_url: https://openlibrary.org
    # Open Library asks frequent API clients to include contact information.
    # Keep personal contact details in config.yaml, not in this committed example.
    contact: null
    # Guardrail against accidentally turning a metadata run into bulk harvesting.
    max_books_per_run: 25
    timeout_seconds: 15.0
    max_retries: 2
    anonymous_requests_per_second: 1.0
    identified_requests_per_second: 3.0

  googlebooks:
    base_url: https://www.googleapis.com/books/v1
    # Optional. Public volume search works without a key, but a key may be useful
    # if Google Books quota policy changes or your usage grows.
    api_key: null
    timeout_seconds: 15.0
    max_retries: 2
    requests_per_second: 2.0

calibre:
  library: null
  executable: null
  auto_apply_confidence: 0.98
  review_confidence: 0.80
