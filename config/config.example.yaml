database: ~/.local/share/calibre-research/research.sqlite3
rubric: ./config/rubric-1.0.yaml

research:
  max_cost_per_run_usd: 5.00
  max_cost_per_book_usd: 0.10
  web_search_enabled: true
  reuse_cached_evidence: true
  wikidata:
    # Free, credential-free structured award and nomination research.
    enabled: true
    base_url: https://www.wikidata.org/w/api.php
    timeout_seconds: 15.0
    max_candidates: 5

metadata:
  # Providers listed here are enabled and tried in order. Later providers are
  # fallbacks for unresolved records. Remove an entry to disable that provider;
  # its configuration section below may remain.
  providers:
    - openlibrary
    - googlebooks
  reuse_cached_lookups: true

  openlibrary:
    base_url: https://openlibrary.org
    # Open Library asks frequent API clients to include contact information.
    # Keep personal contact details in config.yaml, not in this committed example.
    contact: null
    # Guardrail against accidentally turning a metadata run into bulk harvesting.
    max_books_per_run: 25
    timeout_seconds: 15.0
    max_retries: 2
    retry_wait_multiplier_seconds: 1.0
    retry_wait_max_seconds: 30.0
    anonymous_requests_per_second: 1.0
    identified_requests_per_second: 3.0

  googlebooks:
    base_url: https://www.googleapis.com/books/v1
    # Credentials are required when googlebooks is enabled. The command form is
    # preferred so secrets are not stored in this file.
    api_key_command:
      - op
      - read
      - "op://your-vault/calibre-research/google-books-api-key"
    # null allows interactive authentication to wait until it succeeds or is interrupted.
    api_key_command_timeout_seconds: null
    # Literal fallback; api_key_command takes precedence when both are present.
    api_key: null
    timeout_seconds: 15.0
    max_retries: 2
    retry_wait_multiplier_seconds: 1.0
    retry_wait_max_seconds: 30.0
    requests_per_second: 2.0

calibre:
  library: null
  executable: null
  auto_apply_confidence: 0.98
  review_confidence: 0.80
