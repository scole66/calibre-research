[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "calibre-research"
version = "0.1.0"
description = "Metadata repair and significance research for Calibre libraries"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "pydantic>=2.8",
  "PyYAML>=6.0",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
calibre-research = "calibre_research.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
calibre_research = ["schema.sql"]
